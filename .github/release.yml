changelog:
  categories:
    - title: "New Features"
      labels: ["feature", "enhancement"]
    - title: "Critical Fixes"
      labels: ["bug", "fix"]
    - title: "Small Updates"
      labels: ["documentation", "chore"]
    - title: "Dependencies"
      labels: ["dependencies"]
    # Every other merged pull request (most aren't labelled), so none is
    # left out of the notes.
    - title: "Other Changes"
      labels: ["*"]
  exclude:
    labels:
      - skip-changelog
    authors:
      - octocat

render-anonymous-commits: true