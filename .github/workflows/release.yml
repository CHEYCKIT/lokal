name: Release Lokal

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    strategy:
      matrix:
        # Linux stays on a fixed, older Ubuntu: native modules compiled here
        # only run on systems at least this new, so a newer image would
        # lock older distros out of the AppImage/deb.
        os: [windows-latest, macos-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'

      - name: Setup Rust (for Windows SMTC bridge)
        # Must run before "Install Dependencies": this repo's postinstall
        # script (electron-builder install-app-deps && npm run
        # native:prepare) invokes `cargo build` for the SMTC bridge addon
        # as part of `npm install` itself, so cargo has to already be on
        # PATH by then, not just before a later separate build step.
        if: matrix.os == 'windows-latest'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install Dependencies
        run: npm install

      - name: Build Application
        run: npm run build -- --publish never

      - name: Rename release files for this runner
        shell: bash
        run: |
          cd release 2>/dev/null || exit 0
          
          shopt -s nullglob
          
          for f in *\ *; do
            if [ -f "$f" ]; then
              mv "$f" "${f// /-}"
            fi
          done

      - name: Upload release artifacts
        uses: actions/upload-artifact@v6
        with:
          name: release-${{ matrix.os }}
          path: release

  release:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install Playwright
        run: |
          npm install playwright
          npx playwright install --with-deps chromium

      - name: Generate Release Banner
        id: banner
        env:
          # Read via process.env rather than interpolated into the JS source.
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          # Drawn from this repo (.github/banner): the outside page it used to
          # be taken from stopped answering. Never fails the job.
          # (A build of an older commit doesn't have the drawing: no banner then.)
          if [ -f .github/banner/render.js ]; then
            BANNER_VERSION="$RELEASE_TAG" BANNER_TYPE=release node .github/banner/render.js
          fi
          # Only reference the banner in the release body when it exists, so
          # a skipped banner doesn't leave a broken image at the top.
          if [ -f release-banner.png ]; then
            echo "md=![Release Banner](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/release-banner.png)" >> "$GITHUB_OUTPUT"
          else
            echo "md=" >> "$GITHUB_OUTPUT"
          fi

      - name: Download all artifacts
        uses: actions/download-artifact@v7
        with:
          path: artifacts

      - name: Aggregate artifacts into release_all
        shell: bash
        run: |
          mkdir -p release_all
          shopt -s nullglob
          for d in artifacts/*; do
            if [ -d "$d" ]; then
              cp -R "$d"/* release_all/ || true
            fi
          done
          if [ -z "$(ls -A release_all 2>/dev/null)" ]; then
            mkdir -p release_all
            touch release_all/.no_files
          fi

      - name: Generate checksums for all artifacts
        id: checksums
        shell: bash
        run: |
          if command -v sha256sum >/dev/null 2>&1; then
            SHACMD='sha256sum'
          else
            SHACMD='shasum -a 256'
          fi

          echo "HASHES<<EOF" >> $GITHUB_OUTPUT
          for f in release_all/*; do
            if [ -f "$f" ] && [ "$(basename "$f")" != ".no_files" ]; then
              HASH=$($SHACMD "$f" | awk '{print toupper($1)}')
              NAME=$(basename "$f")
              echo "> **$NAME**: \`[$HASH]\`" >> $GITHUB_OUTPUT
            fi
          done
          if [ -z "$(ls -A release_all 2>/dev/null | grep -v .no_files)" ]; then
            echo "No release files found" >> $GITHUB_OUTPUT
          fi
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Get latest commit message (single)
        id: latest_commit
        shell: bash
        run: |
          MSG=$(git log -1 --pretty=%s)
          echo "LATEST<<EOF" >> $GITHUB_OUTPUT
          echo "$MSG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Generate Release Notes
        id: release_notes
        uses: actions/github-script@v8
        with:
          script: |
            // What changed since the previous official version: the highest
            // vX.Y.Z tag below this one. Nightly tags (v3.2.1-nightly.11) and
            // other pre-release tags are skipped, and so is "latest release",
            // which GitHub would otherwise use and which misses a version
            // that was published late or left as a draft.
            const { execSync } = require('child_process');
            const tag = context.ref.replace('refs/tags/', '');
            const parts = (t) => t.replace(/^v/, '').split(/[.-]/).map(n => parseInt(n, 10)).filter(n => !Number.isNaN(n));
            const below = (a, b) => {
              const x = parts(a), y = parts(b);
              for (let i = 0; i < Math.max(x.length, y.length); i++) {
                if ((x[i] || 0) !== (y[i] || 0)) return (x[i] || 0) < (y[i] || 0);
              }
              return false;
            };
            const previous = execSync("git tag --list 'v*'").toString().split('\n')
              .map(t => t.trim())
              .filter(t => /^v\d+(\.\d+)*$/.test(t) && below(t, tag))
              .sort((a, b) => (below(a, b) ? 1 : -1))[0];
            core.info(`Release notes for ${tag}, since ${previous || 'the first commit'}`);
            const response = await github.rest.repos.generateReleaseNotes({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tag,
              ...(previous ? { previous_tag_name: previous } : {}),
            });
            core.setOutput('body', response.data.body);

      - name: Create GitHub Release
        id: create_release
        uses: softprops/action-gh-release@v3
        with:
          name: Release ${{ github.ref_name }}
          files: |
            release_all/**/*.exe
            release_all/**/*.dmg
            release_all/**/*.AppImage
            release_all/**/*.deb
            release_all/**/*.zip
            release_all/**/latest*.yml
            release-banner.png
          draft: true
          body: |
            ${{ steps.banner.outputs.md }}

            ${{ steps.latest_commit.outputs.LATEST }}

            ---

            ## Changelog

            FYI:
            **Lokal is 100% local; the library, history, anything in database, or any info that is used for API's such as yt-dlp, LRCLIB, is *NOT* seen by us.**

            ${{ steps.release_notes.outputs.body }}

            ---

            ## Setup

            See [README.md](./README.md) for full setup instructions.

            ---

            ### Binary Checksums (SHA-256)

            ${{ steps.checksums.outputs.HASHES }}

      - name: Discord Notification (Build Complete)
        shell: bash
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          LATEST_MSG="${{ steps.latest_commit.outputs.LATEST }}"
          BANNER_URL="https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/release-banner.png"
          
          PAYLOAD=$(jq -n \
            --arg version "${{ github.ref_name }}" \
            --arg url "${{ steps.create_release.outputs.html_url }}" \
            --arg msg "$LATEST_MSG" \
            --arg image "$BANNER_URL" \
            --arg footer_icon "https://i.imgur.com/ZC3mEUC.png" \
            --argjson color 3447003 \
            '{
              embeds: [{
                title: "Build Complete: Lokal \($version)",
                description: "All platform binaries for version **\($version)** have been successfully built and uploaded to the release draft. \n\n**Status:** Draft Ready\n**Last Commit:** \($msg)",
                url: $url,
                color: $color,
                image: { url: $image },
                footer: { text: "Lokal Build System", icon_url: $footer_icon }
              }]
            }'
          )

          curl -H "Content-Type: application/json" -d "$PAYLOAD" "$DISCORD_WEBHOOK"
