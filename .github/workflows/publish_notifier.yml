name: Notify Published Release

on:
  release:
    types: [published, released]
  workflow_dispatch: 

permissions:
  contents: read

jobs:
  discord-announcement:
    # Announce real releases only, never the nightly pre-release.
    if: github.event_name != 'release' || github.event.release.prerelease != true
    runs-on: ubuntu-24.04
    steps:
      - name: Debug Event Data
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          printf 'Event Type: %s\n' "$EVENT_NAME"
          printf 'Release Tag: %s\n' "$RELEASE_TAG"

      - name: Discord Notification
        shell: bash
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_NAME: ${{ github.event.release.name }}
          RELEASE_URL: ${{ github.event.release.html_url }}
        run: |
          if [ "$EVENT_NAME" == "workflow_dispatch" ] || [ -z "$RELEASE_TAG" ]; then
            RELEASE_DATA=$(curl -fsS -H "Authorization: token $GITHUB_TOKEN" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/latest")
            TAG=$(echo "$RELEASE_DATA" | jq -r .tag_name)
            NAME=$(echo "$RELEASE_DATA" | jq -r .name)
            URL=$(echo "$RELEASE_DATA" | jq -r .html_url)
          else
            TAG="$RELEASE_TAG"
            NAME="$RELEASE_NAME"
            URL="$RELEASE_URL"
          fi
          if [ "$NAME" == "null" ] || [ -z "$NAME" ]; then NAME="Release $TAG"; fi

          PAYLOAD=$(jq -n \
            --arg tag "$TAG" \
            --arg name "$NAME" \
            --arg url "$URL" \
            --arg image "https://i.imgur.com/KgjwTvk.png" \
            --arg footer_icon "https://i.imgur.com/ZC3mEUC.png" \
            --argjson color 3066993 \
            '{
              content: "**A new Lokal update is now available!**",
              embeds: [{
                title: "Lokal \($tag) is here!",
                description: "The latest version of Lokal is now available for download!\n\n**What’s New:**\n\($name)\n\nGrab the update from GitHub below.",
                url: $url,
                color: $color,
                image: { url: $image },
                footer: { text: "Lokal - Local-first Music Player", icon_url: $footer_icon }
              }]
            }'
          )

          curl -X POST -H "Content-Type: application/json" -d "$PAYLOAD" "$DISCORD_WEBHOOK"